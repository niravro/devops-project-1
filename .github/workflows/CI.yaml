# Build and test
# Publish to Docker Hub
# Update Helm values.yaml with new image tag

name: flask-app-CI

on:
  push:
    branches:
      - feature/devops
    paths-ignore:
      - 'README.md'
      - '.github/workflows/CI.yaml'
      - 'helm/**'
      - 'k8s/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.14'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Run Tests
          run: |
            pytest src/app_test.py

  push:
    runs-on: ubuntu-latest
    needs: build

    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PAT }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v4
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/flask-app:{{ github.sha }}

    #   - name: Run tests
    #     run: |
    #       docker run --rm your-dockerhub-user/devops-project-1:v0.1.0 pytest tests/

  update-helm:
    runs-on: ubuntu-latest
    needs: push
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Update Helm values.yaml
          run: |
            sed -i 's/tag: .*/tag: "{{ github.sha }}"/' helm/flask-app-chart/values.yaml

        - name: Commit and push changes
          run: |
            git config --global user.name "niravro.datta"
            git config --global user.email "niravro@gmail.com"
            git add helm/flask-app-chart/values.yaml
            git commit -m "Update Helm values.yaml with new image tag ${{ github.sha }}"
            git push origin main